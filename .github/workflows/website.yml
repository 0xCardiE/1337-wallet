name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Build static site
        run: npm run build
        working-directory: website
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
      - name: Trust server host key
        run: ssh-keyscan -t ed25519,ecdsa,rsa 95.216.6.96 >> ~/.ssh/known_hosts
      - name: Rsync to 1337wallet.io
        run: >
          rsync -az --delete
          -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes"
          website/out/
          root@95.216.6.96:/var/www/1337-wallet/website/out/
