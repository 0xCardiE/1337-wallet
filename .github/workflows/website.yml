name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Build static site
        run: npm run build
        working-directory: website
      - name: Rsync to 1337wallet.io
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 95.216.6.96 >> ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/1337wallet_deploy
          ssh_opts="ssh -i $HOME/.ssh/1337wallet_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o ConnectTimeout=15"
          for i in 1 2 3 4 5; do
            if rsync -az --delete -e "$ssh_opts" website/out/ root@95.216.6.96:/var/www/1337-wallet/website/out/; then
              exit 0
            fi
            echo "rsync attempt $i failed; retrying..."
            sleep $((i * 4))
          done
          exit 1
