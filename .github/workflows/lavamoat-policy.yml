name: LavaMoat policy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Check LavaMoat policies are current
        run: npm run lavamoat:check
      - name: Production build
        run: npm run build
