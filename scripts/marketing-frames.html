<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>1337 listing frames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #041108;
        --paper: #f4fff0;
        --lime: #b4e62a;
        --amber: #d9a014;
        --alert: #c41e2a;
        --forest: #4a8c32;
        --moss: #6aa83a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .stage[data-layout='shot'] { width: 1280px; height: 800px; }
      .stage[data-layout='marquee'] { width: 1400px; height: 560px; }
      .stage[data-layout='small'] { width: 440px; height: 280px; }

      .field, .wash, .grid, .grain, .scan, .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .field { z-index: 0; }
      .wash { z-index: 1; }
      .grid {
        z-index: 2;
        background-image:
          linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%);
      }
      .grain {
        z-index: 8;
        opacity: 0.22;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
      }
      .scan {
        z-index: 9;
        opacity: 0.1;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 2px,
          rgba(0,0,0,0.35) 2px 3px
        );
      }

      .copy {
        position: absolute;
        z-index: 4;
        left: 64px;
        top: 50%;
        transform: translateY(-52%);
        width: 620px;
      }
      .kicker {
        margin: 0 0 18px;
        font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 0.92;
        font-weight: 900;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }
      .sub {
        margin: 22px 0 0;
        max-width: 34ch;
        font-size: 20px;
        line-height: 1.35;
        font-weight: 600;
        opacity: 0.88;
      }
      .brand {
        position: absolute;
        z-index: 5;
        left: 64px;
        bottom: 36px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.06em;
        font-size: 18px;
        line-height: 1;
      }
      .brand img {
        display: block;
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        object-fit: contain;
        image-rendering: pixelated;
        transform: translateY(-2px);
      }
      .brand span {
        display: block;
        line-height: 1;
      }
      .device {
        position: absolute;
        z-index: 6;
        right: 72px;
        top: 50%;
        transform: translateY(-50%);
        height: 684px;
        border-radius: 22px;
        overflow: hidden;
        background: #050806;
        box-shadow:
          0 0 0 3px #041108,
          0 0 0 6px rgba(180, 230, 42, 0.55),
          0 24px 64px rgba(0, 0, 0, 0.5);
      }
      .device img {
        display: block;
        height: 684px;
        width: auto;
      }

      /* Hero — keys, promo, accounts */
      .theme-lime { background: #08140a; color: var(--ink); }
      .theme-lime .field {
        background: var(--lime);
        clip-path: polygon(0 0, 62% 0, 50% 100%, 0 100%);
      }
      .theme-lime .wash {
        background:
          radial-gradient(circle at 78% 30%, rgba(180,230,42,0.16), transparent 36%),
          linear-gradient(115deg, transparent 48%, #041108 48%);
      }
      .theme-lime .kicker,
      .theme-lime .brand { color: #1a360c; }
      .theme-lime h1 { color: #041108; }
      .theme-lime .sub { color: #1c3a10; }

      /* Default family — tools, assets, history */
      .theme-forest { background: #06120a; color: var(--ink); }
      .theme-forest .field {
        background: var(--forest);
        clip-path: polygon(0 0, 62% 0, 50% 100%, 0 100%);
      }
      .theme-forest .wash {
        background: linear-gradient(105deg, transparent 46%, #06120a 46%);
      }
      .theme-forest .kicker,
      .theme-forest .brand { color: #0e2410; }
      .theme-forest h1 { color: #041108; }
      .theme-forest .sub { color: #123016; }

      /* Slightly lighter green — send, signings, ens, gas */
      .theme-moss { background: #07140b; color: var(--ink); }
      .theme-moss .field {
        background: var(--moss);
        clip-path: polygon(0 0, 62% 0, 50% 100%, 0 100%);
      }
      .theme-moss .wash {
        background: linear-gradient(105deg, transparent 46%, #07140b 46%);
      }
      .theme-moss .kicker,
      .theme-moss .brand { color: #143016; }
      .theme-moss h1 { color: #041108; }
      .theme-moss .sub { color: #163818; }

      /* Confirm — caution */
      .theme-amber { background: #161208; color: var(--ink); }
      .theme-amber .field {
        background: var(--amber);
        clip-path: polygon(0 0, 62% 0, 50% 100%, 0 100%);
      }
      .theme-amber .wash {
        background: linear-gradient(105deg, transparent 46%, #161208 46%);
      }
      .theme-amber .kicker,
      .theme-amber .brand { color: #3a2408; }
      .theme-amber h1 { color: #161208; }
      .theme-amber .sub { color: #3a2408; }
      .theme-amber .device {
        box-shadow:
          0 0 0 3px #161208,
          0 0 0 6px rgba(217,160,20,0.55),
          0 24px 64px rgba(0,0,0,0.5);
      }

      /* Revoke — danger */
      .theme-alert { background: #160808; color: var(--lime); }
      .theme-alert .field {
        background: var(--alert);
        clip-path: polygon(0 0, 62% 0, 50% 100%, 0 100%);
      }
      .theme-alert .wash {
        background: linear-gradient(105deg, transparent 46%, #140606 46%);
      }
      .theme-alert .kicker,
      .theme-alert .brand { color: #2a0c0c; }
      .theme-alert h1 { color: var(--lime); }
      .theme-alert .sub { color: #2a0c0c; }
      .theme-alert .copy { color: var(--lime); }

      /* Settings / empty — charcoal, lime type */
      .theme-char { background: #101410; color: var(--lime); }
      .theme-char .field {
        background: #2a3326;
        clip-path: polygon(0 0, 62% 0, 50% 100%, 0 100%);
      }
      .theme-char .wash {
        background: linear-gradient(105deg, transparent 46%, #101410 46%);
      }
      .theme-char .kicker,
      .theme-char .brand { color: #9cc46a; }
      .theme-char h1 { color: var(--lime); }
      .theme-char .sub { color: #8aaa68; }

      /* Promo marquee */
      .stage[data-layout='marquee'] .copy {
        left: 72px;
        width: 720px;
        transform: translateY(-58%);
      }
      .stage[data-layout='marquee'] h1 { font-size: 78px; }
      .stage[data-layout='marquee'] .sub { font-size: 22px; max-width: 40ch; }
      .stage[data-layout='marquee'] .mascot {
        position: absolute;
        z-index: 6;
        right: 80px;
        top: 50%;
        transform: translateY(-50%);
        width: 420px;
        height: 420px;
        display: grid;
        place-items: center;
      }
      .stage[data-layout='marquee'] .mascot img {
        position: relative;
        width: 300px;
        height: 300px;
        image-rendering: pixelated;
        filter: drop-shadow(0 12px 28px rgba(0,0,0,0.45));
      }
      .stage[data-layout='marquee'] .word {
        position: absolute;
        z-index: 6;
        right: 88px;
        bottom: 48px;
        width: 280px;
      }
      .stage[data-layout='marquee'] .word img { width: 100%; height: auto; display: block; }

      /* Promo small */
      .stage[data-layout='small'] .copy {
        left: 168px;
        top: 50%;
        width: 250px;
        transform: translateY(-50%);
      }
      .stage[data-layout='small'] .kicker { font-size: 10px; margin-bottom: 8px; }
      .stage[data-layout='small'] h1 { font-size: 42px; }
      .stage[data-layout='small'] .sub { display: none; }
      .stage[data-layout='small'] .brand { left: 168px; bottom: 22px; font-size: 12px; gap: 8px; color: #041108; }
      .stage[data-layout='small'] .brand img { width: 18px; height: 18px; image-rendering: pixelated; }
      .stage[data-layout='small'].theme-lime .field { clip-path: none; }
      .stage[data-layout='small'].theme-lime .wash { display: none; }
      .stage[data-layout='small'].theme-lime .grid { opacity: 0.2; }
      .stage[data-layout='small'] .mascot {
        position: absolute;
        z-index: 6;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 132px;
        height: 132px;
      }
      .stage[data-layout='small'] .mascot img {
        width: 132px;
        height: 132px;
        image-rendering: pixelated;
        filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="field"></div>
      <div class="wash"></div>
      <div class="grid"></div>
      <div class="copy">
        <p class="kicker" id="kicker"></p>
        <h1 id="headline"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="brand" id="brand">
        <img id="brand-skull" alt="" />
        <span>1337 WALLET</span>
      </div>
      <div class="device" id="device" hidden>
        <img id="shot" alt="" />
      </div>
      <div class="mascot" id="mascot" hidden>
        <img id="mascot-img" alt="" />
      </div>
      <div class="word" id="word" hidden>
        <img id="word-img" alt="" />
      </div>
      <div class="grain"></div>
      <div class="scan"></div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const layout = q.get('layout') || 'shot';
      const theme = q.get('theme') || 'lime';
      const stage = document.getElementById('stage');
      stage.dataset.layout = layout;
      stage.classList.add('theme-' + theme);

      const headline = (q.get('headline') || '').replace(/\|/g, '\n');
      document.getElementById('headline').innerHTML = headline
        .split('\n')
        .map((line) => line.replace(/&/g, '&amp;').replace(/</g, '&lt;'))
        .join('<br>');
      document.getElementById('kicker').textContent = q.get('kicker') || '';
      document.getElementById('sub').textContent = q.get('sub') || '';

      const skull = q.get('skull') || '';
      document.getElementById('brand-skull').src = skull;
      document.getElementById('mascot-img').src = skull;

      const word = q.get('word') || '';
      if (word) document.getElementById('word-img').src = word;

      const shot = q.get('shot') || '';
      if (layout === 'shot' && shot) {
        document.getElementById('device').hidden = false;
        document.getElementById('shot').src = shot;
      }
      if (layout === 'marquee' || layout === 'small') {
        document.getElementById('mascot').hidden = false;
        if (layout === 'marquee' && word) document.getElementById('word').hidden = false;
      }
    </script>
  </body>
</html>
